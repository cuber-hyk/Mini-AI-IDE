<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:"
    />
    <title>网页区工具条</title>
    <link rel="stylesheet" href="./ui-tokens.css" />
    <link rel="stylesheet" href="./ui.css" />
    <link rel="stylesheet" href="./webbar.css" />
  </head>
  <body>
    <div id="bar" class="webbar">
      <div class="bar-wide">
        <button id="btn-workspace-toggle" type="button" class="ui-icon" aria-label="收起工作区" title="收起工作区" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M5 2.5v11"/></svg></button>
        <span class="webbar-title">DeepSeek</span>
        <span class="spacer"></span>
        <span id="collect-status" class="collect-status" role="status" aria-live="polite"></span>
        <button id="btn-collect" type="button" class="ui-button" title="只读采集最新回复，结果显示在工具区">采集回复</button>
        <button id="btn-file-restore" type="button" class="ui-icon" aria-label="展开文件工作区" title="展开文件工作区" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M11 2.5v11"/></svg></button>
      </div>
    </div>
    <script src="./webbar.js"></script>
  </body>
</html>
