<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'"
    />
    <title>Mini-AI-IDE — 编辑器</title>
    <link rel="stylesheet" href="./ui-tokens.css" />
    <link rel="stylesheet" href="./ui.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./fileExplorer.css" />
    <link rel="stylesheet" href="./applicationUpdate.css" />
    <link rel="stylesheet" href="./toolHarness.css" />
    <link rel="stylesheet" href="./workspaceNavigation.css" />
    <link rel="stylesheet" href="./localPrompt.css" />
  </head>
  <body>
    <nav id="workspace-navigation" class="workspace-navigation" aria-label="项目工作区">
      <div class="workspace-brand">
        <svg class="workspace-brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="8" width="16" height="11" rx="4"/><path d="M12 8V4M9 13h.01M15 13h.01"/></svg><span class="workspace-brand-name">Mini AI</span><span class="workspace-product">IDE</span>
        <span id="app-version" class="app-version" aria-label="当前版本" hidden></span>
        <div id="update-wrap" class="update-wrap">
          <button id="btn-update" type="button" class="ui-icon update-trigger" title="软件更新" aria-label="软件更新" aria-haspopup="dialog">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path class="update-download-mark" d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 10.5v3h11v-3"/><path class="update-ready-mark" d="m3.5 8 3 3 6-6"/></svg>
            <span class="update-dot" aria-hidden="true"></span>
          </button>

        </div>
        <button id="workspace-collapse" class="ui-icon" type="button" title="收起工作区" aria-label="收起工作区" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M5 2.5v11"/></svg></button>
      </div>
      <div class="workspace-heading"><span>工作区</span><button id="workspace-add" class="ui-icon" type="button" title="添加项目" aria-label="添加项目">＋</button></div>
      <input id="workspace-search" class="workspace-search" type="search" placeholder="搜索项目…" aria-label="搜索工作区项目" />
      <ul id="workspace-list" class="workspace-list"></ul>
      <p id="workspace-message" class="workspace-message" role="status" aria-live="polite"></p>
      <p class="workspace-footnote">切换本地项目 · 官网对话保持不变</p>
    </nav>
    <button id="workspace-restore" class="ui-icon workspace-restore" type="button" aria-label="展开工作区" title="展开工作区" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M11 2.5v11m2-6 1.5 1.5L13 9.5"/></svg></button>
    <div id="workspace-resizer" class="workspace-divider" role="separator" tabindex="0" aria-label="调整项目工作区宽度" aria-orientation="vertical"></div>
    <header class="toolbar">
      <div id="editor-tabs" class="editor-tabs" role="tablist" aria-label="文件、工具与改动" hidden></div>
      <span class="spacer"></span>
      <!-- 保存沿用 Ctrl+S，未保存状态在文件标签与工具栏显示。 -->
      <span id="dirty-flag" class="dirty"></span>
      <button id="btn-sidebar" class="ui-icon" type="button" title="展开目录树（Ctrl+B）" aria-label="展开目录树" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6-2 2 2 2"/><rect x="6" y="2.5" width="8.5" height="11" rx="1"/><path d="M11 2.5v11"/></svg></button>
      <button id="file-maximize" class="ui-icon" type="button" title="最大化文件区" aria-label="最大化文件区" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="maximize-mark" d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/><path class="restore-mark" d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg></button>
      <button id="file-collapse" class="ui-icon" type="button" aria-label="收起文件工作区" title="收起文件工作区"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M11 2.5v11m2-6 1.5 1.5L13 9.5"/></svg></button>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-title"><span class="sidebar-caption"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 13V3h5l2 2h6v8z"/></svg>文件</span><span class="spacer"></span><button id="tree-collapse" class="ui-icon" type="button" title="收起目录树" aria-label="收起目录树"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M11 2.5v11m2-6 1.5 1.5L13 9.5"/></svg></button></div>
        <div class="sidebar-head"><span id="tree-root-path" class="tree-root-path" title="">未选择项目</span><span class="spacer"></span>
          <button id="file-new" type="button" class="ui-icon" title="新建文件" aria-label="新建文件"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h6l3 3V8M3 1.5v13h4M9 1.5v3h3M11 9v6M8 12h6"/></svg></button>
          <button id="folder-new" type="button" class="ui-icon" title="新建文件夹" aria-label="新建文件夹"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 13V3h5l2 2h6v3M10.5 9v6M7.5 12h6"/></svg></button>
          <button id="file-refresh" type="button" class="ui-icon" title="刷新目录" aria-label="刷新目录"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 7a5.5 5.5 0 1 0-1.5 5M13.5 2v5h-5"/></svg></button>
        </div>
        <ul id="tree" class="tree"></ul>
        <div id="tree-note" class="tree-note">从左侧选择项目</div>
      </aside>
      <!-- 目录树与编辑器之间：拖动调整目录树宽度（双击复位） -->
      <div id="sidebar-resizer" class="sidebar-resizer" title="拖动调整目录树宽度（双击复位）"></div>

      <section class="editor-wrap">
        <div id="monaco" class="monaco"></div>
        <div id="workspace-welcome" class="workspace-welcome" hidden></div>
        <div id="info" class="info">未打开文件</div>
      </section>

      <section id="tool-workspace" class="tool-workspace" aria-label="工具" hidden>
    <section id="tool-dock" class="tool-dock" aria-label="工具结果面板">
    <details id="tool-panel" class="tool-panel" open>
      <summary class="tool-panel-summary">
        <span class="tool-panel-heading"><span>工具结果</span><span id="tool-count" class="tool-count">0 项</span></span>
        <span class="tool-panel-status">
          <span id="tool-activity" class="tool-activity">读取状态…</span>
          <span id="tool-completion-notice" class="tool-completion-notice" role="status" aria-live="polite" aria-atomic="true"></span>
          <span id="tool-continue-notice" class="tool-completion-notice" role="status" aria-live="polite"></span>
          <span id="tool-copy-notice" class="tool-completion-notice" role="status" aria-live="polite"></span>
          <span id="tool-return-notice" class="tool-completion-notice" role="status" aria-live="polite"></span>
          <span id="tool-sound-notice" class="tool-sound-notice" role="status" aria-live="polite"></span>
        </span>
      </summary>
      <div id="tool-panel-body" class="tool-panel-body">
        <p id="tool-message" class="tool-message" role="status" aria-live="polite" aria-atomic="true">正在读取工具状态…</p>
        <div id="tool-results" class="tool-results" aria-label="工具调用结果"></div>
      </div>
    </details>
    <div class="tool-result-actions">
      <button id="tool-view-changes" type="button" class="ui-icon" title="查看改动" aria-label="查看改动"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg></button>
      <span class="tool-actions-sep" aria-hidden="true"></span>
      <button id="tool-copy" type="button" class="ui-icon" title="复制本批结果到剪贴板" aria-label="复制本批结果到剪贴板" data-action="copy" disabled>
        <svg class="tool-copy-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="8" height="9" rx="1.5"/><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H11"/></svg>
        <svg class="tool-send-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M8 2l6 6-6 6"/></svg>
      </button>
      <div id="tool-more-wrap" class="tool-more-wrap">
        <button id="tool-more-toggle" type="button" class="ui-icon" aria-label="工具结果操作" title="工具结果操作（撤销）" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool-more" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 1 1.5 3.5"/><path d="M3 4v4h4"/></svg></button>
        <div id="tool-more" class="tool-more" role="dialog" aria-label="工具结果操作" hidden>
          <button id="tool-undo" type="button" disabled>撤销工具修改</button>
        </div>
      </div>
    </div>
    </section>
      </section>

      <!-- 分隔条：位于编辑器视图最右侧；拖动它调整左右分栏 -->
      <div id="resizer" class="resizer" title="拖动调整左右宽度"></div>
    </main>

    <div id="collaboration-dock" class="collaboration-dock">
    <!-- 变更列表在右侧独立视图（见 preview.html），输入区仍属于编辑器。 -->
    <footer class="prompt-bar">
      <div class="prompt-shell">
        <details id="requirement-panel" class="requirement-panel"><summary>编写需求</summary>
        <div id="prompt-attachments" class="prompt-attachments" aria-label="待发送附件" hidden>
          <div id="prompt-attachment-list" class="prompt-attachment-list"></div>
        </div>
        <textarea
          id="requirement"
          class="requirement"
          rows="2"
          aria-label="需求"
          placeholder="描述你想修改的内容… 输入 / 选择技能"
          aria-controls="skill-menu"
          aria-expanded="false"
          spellcheck="false"
        ></textarea>
        <div id="skill-menu" class="skill-menu" role="listbox" aria-label="选择技能" hidden></div>
        <div id="skill-chips" class="skill-chips" aria-label="已选技能" hidden></div>
        <div class="skill-preview-controls"><button id="skill-preview-close" type="button" class="ui-button">收起技能说明</button></div>
        <pre id="skill-preview" class="skill-preview" aria-label="技能说明" hidden></pre>
        <div id="prompt-actions" class="prompt-actions">
        <div id="local-prompt-options" class="local-prompt-options">
          <button id="btn-add-prompt-attachment" type="button" class="ui-icon" title="添加文档或图片，最多 50 个，每个不超过 100 MB" aria-label="添加附件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <label title="新对话或需要重新说明规则时勾选"><input id="prompt-initialization" type="checkbox" checked disabled />附带初始化提示词</label>
        </div>
          <span id="prompt-custom" class="prompt-custom" title="当前使用自定义提示词" role="img" aria-label="当前使用自定义提示词" hidden></span>
        <div class="tool-controls">
          <div id="tool-permission-control" class="tool-permission-control" data-permission="ask">
          <label class="tool-permission-label" for="tool-permission" title="工具执行权限">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="permission-hand" d="M8 12V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-6a1.5 1.5 0 0 1 3 0v7-3a1.5 1.5 0 0 1 3 0v7c0 4-3 6-6 6h-1c-2 0-3-1-4-3l-4-6a1.5 1.5 0 0 1 2-2l3 3"/>
              <g class="permission-shield"><path d="m12 3 8 4v6c0 4-5 7-8 8-3-1-8-4-8-8V7Z"/><path class="permission-rules" d="m9 10 3 2-3 2m5 1h2"/><path class="permission-full" d="M12 8v5m0 3v.2"/></g>
            </svg>
          </label>
          <select id="tool-permission" class="tool-select" aria-label="工具执行权限" disabled>
            <option value="ask">请求批准</option>
            <option value="rules">按规则自动</option>
            <option value="full">完全访问权限</option>
          </select>
          </div>
          <label class="tool-auto-label" title="自动采集、执行并发送本批结果；关闭不会中断本轮工具"><input id="tool-automatic" type="checkbox" disabled /> 自动继续</label>
        </div>
        <span class="spacer"></span>
        <div id="tool-settings-wrap" class="tool-settings-wrap">
          <button id="tool-settings-toggle" type="button" class="ui-icon" aria-label="工具设置" title="工具设置" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.95 5.31L10.19 2.67L13.81 2.67L14.05 5.31L15.29 5.82L17.31 4.12L19.88 6.69L18.18 8.71L18.69 9.95L21.33 10.19L21.33 13.81L18.69 14.05L18.18 15.29L19.88 17.31L17.31 19.88L15.29 18.18L14.05 18.69L13.81 21.33L10.19 21.33L9.95 18.69L8.71 18.18L6.69 19.88L4.12 17.31L5.82 15.29L5.31 14.05L2.67 13.81L2.67 10.19L5.31 9.95L5.82 8.71L4.12 6.69L6.69 4.12L8.71 5.82Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button id="btn-send-prompt" type="button" class="ui-button primary prompt-send" aria-label="发送需求" title="发送需求" disabled><svg class="prompt-send-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg><span class="prompt-send-spinner" aria-hidden="true"></span></button>
        </div>
        </details>
      </div>
    </footer>
    </div>

    <script src="./vendor/monaco/vs/loader.js"></script>
    <script src="./promptComposer.js"></script>
    <script src="./localPrompt.js"></script>
    <script src="./editorToolbar.js"></script>
    <script src="./applicationUpdate.js"></script>
    <script src="./editorWorkspace.js"></script>
    <script src="./editorTabs.js"></script>
    <script src="./fileIcons.js"></script>
    <script src="./fileExplorer.js"></script>
    <script src="./workspaceNavigation.js"></script>
    <script src="./workspaceLayout.js"></script>
    <script src="./fileWorkspace.js"></script>
    <script src="./renderer.js"></script>
    <script src="./toolResultPresentation.js"></script>
    <script src="./toolPanelLayout.js"></script>
    <script src="./toolExecutionClock.js"></script>
    <script src="./toolCompletionSound.js"></script>
    <script src="./toolAttention.js"></script>
    <script src="./toolHarness.js"></script>
  </body>
</html>
