<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'"
    />
    <title>Mini-AI-IDE — 编辑器</title>
    <link rel="stylesheet" href="./ui-tokens.css" />
    <link rel="stylesheet" href="./ui.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./applicationUpdate.css" />
    <link rel="stylesheet" href="./toolHarness.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-open" type="button" class="ui-button">打开目录…</button>
      <span id="root-label" class="root-label">未打开目录</span>
      <span class="spacer"></span>
      <!--
        这里原本有个「保存 (Ctrl+S)」按钮，已按用户意见移除：
        Ctrl+S 是人人都会的快捷键，为它单独占一个工具栏按钮不划算，
        而工具栏宽度在按钮变多后已经很挤。
        保存能力**没有丢** —— 快捷键注册在 Monaco 上（见 renderer.js 的 initMonaco）：
          window.monaco.KeyMod.CtrlCmd | window.monaco.KeyCode.KeyS
        未保存状态改由工具栏的「● 未保存」文字 + 文件名旁的白点提示（见 renderDirty）。
      -->
      <span id="dirty-flag" class="dirty"></span>
      <div id="update-wrap" class="update-wrap">
        <button id="btn-update" type="button" class="ui-icon update-trigger" title="软件更新" aria-label="软件更新" aria-haspopup="dialog" aria-expanded="false" aria-controls="update-panel">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path class="update-download-mark" d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 10.5v3h11v-3"/><path class="update-ready-mark" d="m3.5 8 3 3 6-6"/></svg>
          <span class="update-dot" aria-hidden="true"></span>
        </button>
        <section id="update-panel" class="update-panel" role="dialog" aria-modal="false" aria-labelledby="update-heading" tabindex="-1" hidden>
          <div class="update-header"><span class="update-eyebrow">软件更新</span><button id="update-close" type="button" class="ui-icon update-close" title="关闭更新面板" aria-label="关闭更新面板"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
          <h2 id="update-heading">检查新版本</h2>
          <div id="update-versions" class="update-versions"></div>
          <p id="update-message" class="update-message" aria-live="polite" aria-atomic="true"></p>
          <div id="update-notes-section" class="update-notes-section" hidden>
            <h3>更新内容</h3><p id="update-notes" class="update-notes"></p>
            <button id="update-notes-toggle" type="button" class="update-text-button" aria-expanded="false" aria-controls="update-notes" hidden>展开完整说明</button>
          </div>
          <div id="update-progress-wrap" class="update-progress-wrap" hidden>
            <div class="update-progress-label"><span>正在下载</span><span id="update-percent"></span></div>
            <progress id="update-progress" max="100" value="0" aria-label="更新下载进度"></progress>
          </div>
          <div class="update-footer"><span id="update-hint" class="update-hint">由你选择何时更新</span><button id="update-action" type="button" class="ui-button primary">检查更新</button></div>
        </section>
      </div>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head"><span>文件</span><span class="spacer"></span>
          <button id="file-new" type="button" class="ui-icon" title="新建文件" aria-label="新建文件"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h6l3 3V8M3 1.5v13h4M9 1.5v3h3M11 9v6M8 12h6"/></svg></button>
          <button id="folder-new" type="button" class="ui-icon" title="新建文件夹" aria-label="新建文件夹"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 13V3h5l2 2h6v3M10.5 9v6M7.5 12h6"/></svg></button>
          <button id="file-refresh" type="button" class="ui-icon" title="刷新目录" aria-label="刷新目录"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 7a5.5 5.5 0 1 0-1.5 5M13.5 2v5h-5"/></svg></button>
        </div>
        <ul id="tree" class="tree"></ul>
        <div id="tree-note" class="tree-note">使用「打开目录…」或菜单 File → 打开目录（Ctrl+O）</div>
      </aside>
      <!-- 目录树与编辑器之间：拖动调整目录树宽度（双击复位） -->
      <div id="sidebar-resizer" class="sidebar-resizer" title="拖动调整目录树宽度（双击复位）"></div>

      <section class="editor-wrap">
        <div class="editor-head">
          <!-- 目录树显隐：图标按钮放在**编辑器板块顶部左侧**（不是全局工具栏）。
               为什么不放进 sidebar 内部：侧栏隐藏时按钮会跟着消失，用户再也点不回来。
               与网页区的显隐按钮（网页区顶部工具条）遵循同一条规则：
               折叠/展开由"被折叠的那块板自己"来控制，但按钮必须留在始终可见的地方。 -->
          <button id="btn-sidebar" type="button" class="icon-btn" title="显示/隐藏目录树（Ctrl+B）">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" />
              <path d="M6.5 2.5v11" />
            </svg>
          </button>
          <span id="file-name" class="file-name">未打开文件</span>
          <span id="file-dot" class="file-dot" title="有未保存的修改" hidden></span>
          <span class="spacer"></span>
          <div id="context-menu-wrap" class="context-menu-wrap">
            <button id="btn-copy-context" type="button" class="ui-button" aria-haspopup="menu" aria-expanded="false" aria-controls="context-menu" title="选择要复制给模型的文件上下文">复制上下文 <span aria-hidden="true">▾</span></button>
            <div id="context-menu" class="context-menu" role="menu" aria-label="复制上下文" hidden>
              <button id="btn-whole-file" type="button" role="menuitem" tabindex="-1" title="复制当前整个文件，含路径与代码围栏">复制整个文件</button>
              <button id="btn-snippet" type="button" role="menuitem" tabindex="-1" title="复制选中内容，含文件路径与真实行号">复制选中片段</button>
            </div>
          </div>
          <!-- diff 标记的操作条。差异**内联渲染在编辑器里**（原地标红/绿），
               不是一个独立的对比面板 —— 所以这里只放"这个文件有变更"的说明与操作。 -->
          <span id="diff-actions" class="diff-actions" hidden>
            <span class="diff-tag" title="编辑器里的红色/绿色标记就是这个文件的变更">变更预览</span>
            <span id="diff-label" class="diff-label"></span>
            <button id="btn-diff-prev" type="button" aria-label="上一个被改动的文件" title="上一个被改动的文件">‹</button>
            <button id="btn-diff-next" type="button" aria-label="下一个被改动的文件" title="下一个被改动的文件">›</button>
            <button id="btn-diff-apply" type="button" class="primary">应用此变更</button>
            <button id="btn-diff-close" type="button">退出预览</button>
          </span>
        </div>
        <!-- 普通编辑视图。内联 diff 就画在这个编辑器上（decoration + view zone），
             **不再有第二个 Monaco 宿主**：用户看到的始终是同一个编辑器、同一份真实文件内容。 -->
        <div id="editor-tabs" class="editor-tabs" role="tablist" aria-label="打开的文件" hidden></div>
        <div id="monaco" class="monaco"></div>
        <div id="workspace-welcome" class="workspace-welcome" hidden></div>
        <div id="info" class="info">未打开文件</div>
      </section>

      <!-- 分隔条：位于编辑器视图最右侧；拖动它调整左右分栏 -->
      <div id="resizer" class="resizer" title="拖动调整左右宽度"></div>
    </main>

    <section id="tool-dock" class="tool-dock" aria-label="工具结果面板">
    <div id="tool-resizer" class="tool-resizer" role="separator" aria-label="调整工具面板高度" aria-orientation="horizontal" aria-valuemin="80" aria-valuemax="260" aria-valuenow="160" tabindex="0" title="拖动调整高度；方向键调整，双击复位" hidden></div>
    <details id="tool-panel" class="tool-panel">
      <summary class="tool-panel-summary"><span>工具结果</span><span id="tool-count" class="tool-count">0 项</span><span id="tool-activity" class="tool-activity"></span><span id="tool-completion-notice" class="tool-completion-notice" role="status" aria-live="polite" aria-atomic="true"></span><span id="tool-copy-notice" class="tool-completion-notice" role="status" aria-live="polite"></span><span id="tool-sound-notice" class="tool-sound-notice" role="status" aria-live="polite"></span></summary>
      <div id="tool-panel-body" class="tool-panel-body">
        <p id="tool-message" class="tool-message" role="status" aria-live="polite" aria-atomic="true">正在读取工具状态…</p>
        <div id="tool-results" class="tool-results" aria-label="工具调用结果"></div>
      </div>
    </details>
    <div class="tool-result-actions">
      <button id="tool-copy" type="button" class="ui-button" disabled>复制本批结果</button>
      <div id="tool-more-wrap" class="tool-more-wrap">
        <button id="tool-more-toggle" type="button" class="ui-icon" aria-label="工具结果设置与操作" title="工具结果设置与操作（自动复制、撤销）" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool-more">⋯</button>
        <div id="tool-more" class="tool-more" role="dialog" aria-label="工具结果设置与操作" hidden>
          <label class="tool-auto-label" title="本批工具全部执行结束后复制整批结果一次，由你粘贴发送"><input id="tool-auto-copy" type="checkbox" disabled /> 工具完成后自动复制</label>
          <button id="tool-undo" type="button" disabled>撤销工具修改</button>
        </div>
      </div>
    </div>
    </section>

    <!-- 变更列表在右侧独立视图（见 preview.html），输入区仍属于编辑器。 -->
    <footer class="prompt-bar">
      <div class="prompt-shell">
        <textarea
          id="requirement"
          class="requirement"
          rows="2"
          aria-label="需求"
          placeholder="描述你想修改的内容…"
          spellcheck="false"
        ></textarea>
        <div id="prompt-actions" class="prompt-actions">
          <div class="prompt-options">
            <div class="variant-switch" id="variant-switch" role="switch" aria-checked="false"
                 tabindex="0" title="切换提示词的详细程度：简洁版（6 个示例）/ 完整版（13 个示例）。点击或按空格切换">
              <span class="variant-thumb" aria-hidden="true"></span>
              <button type="button" class="variant-opt" data-variant="short" aria-pressed="true">简洁</button>
              <button type="button" class="variant-opt" data-variant="full" aria-pressed="false">完整</button>
            </div>
            <span id="prompt-custom" class="prompt-custom" title="当前使用自定义版本" role="img" aria-label="当前使用自定义版本" hidden></span>
          </div>
        <div class="tool-controls">
          <label class="tool-permission-label" for="tool-permission" title="工具执行权限">◇</label>
          <select id="tool-permission" class="tool-select" aria-label="工具执行权限" aria-describedby="tool-permission-hint" disabled>
            <option value="ask">请求批准</option>
            <option value="rules">按规则自动</option>
            <option value="full">完全访问权限</option>
          </select>
          <label class="tool-auto-label"><input id="tool-automatic" type="checkbox" disabled /> 自动采集并执行</label>
        </div>
        <span class="spacer"></span>
        <div id="tool-settings-wrap" class="tool-settings-wrap">
          <button id="tool-settings-toggle" type="button" class="ui-icon" aria-label="工具与提示词设置" title="工具与提示词设置" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool-settings-panel">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v1.9M8 12.5v1.9M1.6 8h1.9M12.5 8h1.9M3.5 3.5l1.35 1.35M11.15 11.15l1.35 1.35M12.5 3.5l-1.35 1.35M4.85 11.15L3.5 12.5"/></svg>
          </button>
          <section id="tool-settings-panel" class="tool-settings-panel" role="dialog" aria-modal="false" aria-labelledby="tool-settings-heading" tabindex="-1" hidden>
            <div class="tool-settings-head"><strong id="tool-settings-heading">工具与提示词</strong><button id="tool-settings-close" type="button" class="ui-icon" aria-label="关闭设置">×</button></div>
            <div class="tool-settings-body">
              <label for="tool-dirty-policy">目标文件有未保存内容时</label>
              <select id="tool-dirty-policy" class="tool-select" disabled>
                <option value="ask">每次询问</option>
                <option value="continue">继续：采用 AI 的修改结果</option>
                <option value="stop">停止修改</option>
              </select>
              <p>“继续”采用 AI 基于磁盘原文生成的修改，替换未保存草稿。</p>
              <label class="tool-auto-label"><input id="tool-completion-sound" type="checkbox" disabled /> 工具完成音效</label>
              <button id="tool-clear-rules" type="button" class="ui-button" disabled>清除本项目已记住规则</button>
              <button id="btn-settings" type="button" class="ui-button" title="编辑提示词与格式要求（Ctrl+Shift+P）">编辑提示词与格式要求</button>
              <span id="tool-permission-hint" class="tool-permission-hint"></span>
            </div>
          </section>
        </div>
          <button id="btn-copy-prompt" type="button" class="primary" aria-live="polite" title="复制完整提示词，由你粘贴并发送到 AI 网页">复制提示词</button>
        </div>
      </div>
    </footer>

    <script src="./vendor/monaco/vs/loader.js"></script>
    <script src="./promptComposer.js"></script>
    <script src="./editorToolbar.js"></script>
    <script src="./applicationUpdate.js"></script>
    <script src="./editorWorkspace.js"></script>
    <script src="./editorTabs.js"></script>
    <script src="./fileExplorer.js"></script>
    <script src="./renderer.js"></script>
    <script src="./toolResultPresentation.js"></script>
    <script src="./toolPanelLayout.js"></script>
    <script src="./toolExecutionClock.js"></script>
    <script src="./toolHarness.js"></script>
  </body>
</html>
