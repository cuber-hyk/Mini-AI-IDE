<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'"
    />
    <title>Mini-AI-IDE — 编辑器</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-open" type="button">打开目录…</button>
      <span id="root-label" class="root-label">未打开目录</span>
      <span class="spacer"></span>
      <button id="btn-format" type="button" title="把「输出格式要求」复制到剪贴板，再由你自己粘贴到 DeepSeek 的提示词里（程序不会替你写入网页）">
        复制格式要求
      </button>
      <button id="btn-collect" type="button" title="只读采集右侧最新回复并解析为待应用变更（不修改页面、不落盘）">
        采集回复
      </button>
      <button id="btn-snippet" type="button" title="把当前选中内容格式化为带文件真实行号的片段（含 ### 文件： 与 ### 范围： 头）复制到剪贴板，供你粘贴给模型做局部修改">
        复制选中片段
      </button>
      <button id="btn-save" type="button" disabled>保存 (Ctrl+S)</button>
      <span id="dirty-flag" class="dirty">已保存</span>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">文件</div>
        <ul id="tree" class="tree"></ul>
        <div id="tree-note" class="tree-note">使用「打开目录…」或菜单 File → 打开目录（Ctrl+O）</div>
      </aside>
      <section class="editor-wrap">
        <div id="monaco" class="monaco"></div>
        <div id="info" class="info">未打开文件</div>
      </section>
      <!-- 分隔条：位于编辑器视图最右侧；拖动它调整左右分栏 -->
      <div id="resizer" class="resizer" title="拖动调整左右宽度"></div>
    </main>

    <!-- 回程预览：采集右侧回复 → 解析 → 逐个预览/应用。默认不落盘（ADR-0004 方案 A） -->
    <section id="preview" class="preview" hidden>
      <div class="preview-head">
        <span class="preview-title">回程预览</span>
        <span id="preview-meta" class="preview-meta"></span>
        <span class="spacer"></span>
        <button id="btn-apply-all" type="button">应用全部可用项</button>
        <button id="btn-undo" type="button">撤销</button>
        <button id="btn-close-preview" type="button">关闭</button>
      </div>
      <div id="preview-notes" class="preview-notes"></div>
      <ul id="preview-list" class="preview-list"></ul>
    </section>

    <!-- 需求输入区：你在这里写需求，点「复制 prompt」后到右侧粘贴。
         程序只写剪贴板，**绝不写入网页输入框**（零注入边界）。 -->
    <footer class="prompt-bar">
      <div class="prompt-row">
        <input
          id="target-files"
          class="target-files"
          type="text"
          placeholder="要改的文件（可留空，多个用逗号分隔，如 src/a.ts, src/b.ts）"
          spellcheck="false"
        />
      </div>
      <div class="prompt-row">
        <textarea
          id="requirement"
          class="requirement"
          rows="2"
          placeholder="在这里写你的需求（只有这段是你写的），点右侧「复制 prompt」→ 到右边 DeepSeek 输入框 Ctrl+V 粘贴 → 自己按发送"
          spellcheck="false"
        ></textarea>
        <button id="btn-copy-prompt" type="button" class="primary">复制 prompt</button>
      </div>
    </footer>

    <script src="./vendor/monaco/vs/loader.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
