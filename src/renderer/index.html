<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'"
    />
    <title>Mini-AI-IDE — 编辑器</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-open" type="button">打开目录…</button>
      <span id="root-label" class="root-label">未打开目录</span>
      <span class="spacer"></span>
      <button id="btn-collect" type="button" title="只读采集右侧最新回复并解析为待应用变更（不修改页面、不落盘），结果显示在右下角预览面板">
        采集回复
      </button>
      <button id="btn-whole-file" type="button" title="把当前打开的整个文件（含路径声明与代码围栏）复制到剪贴板，作为上下文交给模型">
        复制整个文件
      </button>
      <button id="btn-snippet" type="button" title="把当前选中内容格式化为带文件真实行号的片段（含 ### 文件： 与 ### 范围： 头）复制到剪贴板，供你粘贴给模型做局部修改">
        复制选中片段
      </button>
      <button id="btn-save" type="button" disabled>保存 (Ctrl+S)</button>
      <button id="btn-sidebar" type="button" title="显示/隐藏左侧目录树（Ctrl+B）">目录树</button>
      <button id="btn-web" type="button" title="显示/隐藏右侧 AI 网页（Ctrl+Shift+A）">AI 网页</button>
      <button id="btn-preview-toggle" type="button" title="显示/隐藏右下角回程预览面板">回程预览</button>
      <span id="dirty-flag" class="dirty"></span>
    </header>

    <main class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">文件</div>
        <ul id="tree" class="tree"></ul>
        <div id="tree-note" class="tree-note">使用「打开目录…」或菜单 File → 打开目录（Ctrl+O）</div>
      </aside>
      <!-- 目录树与编辑器之间：拖动调整目录树宽度（双击复位） -->
      <div id="sidebar-resizer" class="sidebar-resizer" title="拖动调整目录树宽度（双击复位）"></div>

      <section class="editor-wrap">
        <div class="editor-head">
          <span id="file-name" class="file-name">未打开文件</span>
          <span id="file-dot" class="file-dot" title="有未保存的修改" hidden></span>
          <span class="spacer"></span>
          <!-- diff 视图的操作条：与主流编辑器一致，先看 diff 再决定是否应用 -->
          <span id="diff-actions" class="diff-actions" hidden>
            <span id="diff-label" class="diff-label"></span>
            <button id="btn-diff-apply" type="button" class="primary">应用此变更</button>
            <button id="btn-diff-close" type="button">退出对比</button>
          </span>
        </div>
        <!-- 普通编辑视图 -->
        <div id="monaco" class="monaco"></div>
        <!-- 差异视图（进入时替换显示；用 Monaco DiffEditor 渲染） -->
        <div id="monaco-diff" class="monaco" hidden></div>
        <div id="info" class="info">未打开文件</div>
      </section>

      <!-- 分隔条：位于编辑器视图最右侧；拖动它调整左右分栏 -->
      <div id="resizer" class="resizer" title="拖动调整左右宽度"></div>
    </main>

    <!-- 回程预览已移到**右下角独立面板**（见 src/renderer/preview.html）：
         原先挤在编辑器下方，既压低了编辑器高度，diff 也只有一百多像素高没法看。 -->
    <footer class="prompt-bar">
      <div class="prompt-shell">
        <textarea
          id="requirement"
          class="requirement"
          rows="1"
          placeholder="在这里写需求，然后点右侧按钮复制完整 prompt"
          spellcheck="false"
        ></textarea>
        <button id="btn-copy-prompt" type="button" class="primary" title="组装完整 prompt（需求 + 工作环境 + 目录结构 + 格式要求）到剪贴板，由你自己粘贴到右侧网页">
          复制 prompt
        </button>
      </div>
    </footer>

    <script src="./vendor/monaco/vs/loader.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
